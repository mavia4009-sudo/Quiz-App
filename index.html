<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Quiz Game</title>
</head>

<body>
    <div class="quiz-container">
        <h1>Quiz Game</h1>
        <h2 id="question">Question</h2>
        <div id="answer">
            <button id="OptionA" class="answer">Option A</button>
            <button id="OptionB" class="answer">Option B</button>
            <button id="OptionC" class="answer">Option C </button>
            <button id="OptionD" class="answer">Option D</button>


        </div>
        <button id="next-btn">Next</button>


        <h2 id="result">Result</h2>
        <button id="restart-btn">Restart Quiz</button>
        <div class="timer">
            Time Left: <span id="time">15</span>s
        </div>

        <div class="progress">
            <div id="progress-bar"></div>
            
        </div>
        <div id="question-counter"></div>
    </div>

    <script src="script.js"></script>


</body>

</html>
